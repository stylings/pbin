name: release

on:
  push:
    branches: [master]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$v" > /dev/null 2>&1; then
            echo "release $v already exists, skipping"
            exit 0
          fi
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${t%/*}" arch="${t#*/}" ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags '-s -w' -o "pbin-$os-$arch$ext" ./cmd/pbin
          done
          gh release create "$v" pbin-* --title "$v" --generate-notes
